<style>
/* Layout: one column, max 720px, sticky header, tab bar fixed at the bottom for one-handed use on the phone */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --ink:#1C2633; --muted:#5A6676; --line:#D9E0E8;
  --accent:#2B59C3; --accent-soft:#E3EBFB; --on-accent:#FFFFFF;
  --ok:#23804F; --ok-soft:#E1F3E9; --warn:#B86A00; --warn-soft:#FBEFD9; --bad:#C0392B; --bad-soft:#FBE5E2; --off:#6B7685; --off-soft:#ECEFF3;
  --a-bew:#E4572E; --a-spr:#2B59C3; --a-soz:#D63A7F; --a-mat:#138A8A; --a-kun:#8E44AD; --a-nat:#3E8E2F; --a-sel:#C98A00;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#1A2129; --ink:#E7ECF1; --muted:#9AA6B3; --line:#2C3641;
  --accent:#86A8FF; --accent-soft:#22304D; --on-accent:#0E1520;
  --ok:#5CCB8E; --ok-soft:#173226; --warn:#F0B04A; --warn-soft:#3A2C12; --bad:#F27D6E; --bad-soft:#3D1F1B; --off:#A0AAB6; --off-soft:#252D36;
  --a-bew:#FF8A65; --a-spr:#86A8FF; --a-soz:#F57BB0; --a-mat:#4FC7C7; --a-kun:#C08AE0; --a-nat:#7BCB6A; --a-sel:#F0C04A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#1A2129; --ink:#E7ECF1; --muted:#9AA6B3; --line:#2C3641;
  --accent:#86A8FF; --accent-soft:#22304D; --on-accent:#0E1520;
  --ok:#5CCB8E; --ok-soft:#173226; --warn:#F0B04A; --warn-soft:#3A2C12; --bad:#F27D6E; --bad-soft:#3D1F1B; --off:#A0AAB6; --off-soft:#252D36;
  --a-bew:#FF8A65; --a-spr:#86A8FF; --a-soz:#F57BB0; --a-mat:#4FC7C7; --a-kun:#C08AE0; --a-nat:#7BCB6A; --a-sel:#F0C04A;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink);margin:0}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
h1{font-family:var(--f-display);font-size:1.45rem;margin:0;line-height:1;flex:1;letter-spacing:.2px}
h1 span{color:var(--accent)}
h2{font-family:var(--f-display);font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.pill{font-size:.75rem;padding:4px 10px;border-radius:99px;background:var(--off-soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
main{padding-block:16px 110px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:.85rem}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;color:inherit;background:none}
.btn{border-radius:10px;background:var(--accent);color:var(--on-accent);padding:10px 16px;font-weight:700}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn-sm{padding:6px 12px;font-size:.85rem;background:var(--accent-soft);color:var(--accent);font-weight:700}
.link{color:var(--accent);text-decoration:underline;padding:2px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:99px;font-size:.9rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.area{--c:var(--muted);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.area::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.area.on{background:var(--c);border-color:var(--c);color:var(--surface)}
.area.on::before{background:var(--surface)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-weight:700;white-space:nowrap}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.kid-row{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.kid-row.st-da{border-left-color:var(--ok)}.kid-row.st-krank{border-left-color:var(--bad)}.kid-row.st-fehlt{border-left-color:var(--warn)}.kid-row.st-urlaub{border-left-color:var(--off)}
.kid-name{font-weight:700;font-size:1.05rem}
.kid-meta{font-size:.85rem;color:var(--muted)}
.kid-info{font-size:.85rem;color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{padding:8px 2px;font-size:.88rem;border-radius:8px;color:var(--muted)}
.seg button.on{font-weight:700;color:var(--surface)}
.seg button.on.s-da{background:var(--ok)}.seg button.on.s-fehlt{background:var(--warn)}.seg button.on.s-krank{background:var(--bad)}.seg button.on.s-urlaub{background:var(--off)}
.times{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tally{display:flex;gap:6px;flex-wrap:wrap}
.obs{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.obs:first-child{border-top:0;padding-top:0}
.obs p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.date{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.gap-list{display:flex;flex-direction:column;gap:6px}
.gap-item{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.gap-item b{font-variant-numeric:tabular-nums;color:var(--warn)}
.area-block{display:flex;flex-direction:column;gap:6px;padding-left:12px;border-left:3px solid var(--c)}
.area-block .empty{font-size:.88rem;color:var(--warn)}
.week{display:grid;gap:10px}
.preview{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:.95rem;overflow-wrap:anywhere}
.empty-state{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty-state p{margin:0;max-width:38ch;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding-block:6px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:.72rem;color:var(--muted);min-width:0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:700}
#lock{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto}
#lock .wrap{padding-block:max(40px,env(safe-area-inset-top,0px)) 40px;display:flex;flex-direction:column;gap:16px;max-width:460px}
#lock h1{font-size:2rem;flex:none}
.note{font-size:.88rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.thumb{aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--off-soft);padding:0;display:block;width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.viewer .wrap{display:flex;flex-direction:column;gap:12px;padding-block:12px}
.viewer .big{width:100%;max-height:65vh;object-fit:contain;border-radius:10px;background:var(--off-soft);min-height:200px}
/* Gestalten */
.seg3{grid-template-columns:repeat(3,1fr)}
.seg3 button.on{background:var(--accent);color:var(--on-accent)}
.g-wrap{display:grid;gap:16px;min-width:0}
@media (min-width:1000px){main.wrap.wide{max-width:1240px}.g-wrap{grid-template-columns:minmax(320px,420px) 1fr;align-items:start}.g-preview{position:sticky;top:76px}}
.g-controls{min-width:0}
.g-block{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.tpl{display:flex;flex-direction:column;gap:4px;min-width:0}
.tpl-thumb{display:block;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;aspect-ratio:794/1123;position:relative}
.tpl-thumb .a4{position:absolute;top:0;left:0;zoom:var(--tz,.16);box-shadow:none;pointer-events:none}
.tpl-name{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ki-box{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--accent-soft)}
.ki-box textarea{min-height:70px}
.g-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.g-preview{min-width:0;overflow:hidden;background:var(--off-soft);border-radius:var(--r);padding:12px;box-sizing:border-box}
.thumb.slot{width:72px;height:72px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.grid.pick{grid-template-columns:repeat(4,1fr)}
.btn-sm:disabled{opacity:.35;cursor:default}
/* A4 paper is always white, in both themes */
:root{--paper:#FFFFFF;--paper-ink:#1C2633;--paper-muted:#5A6676;--paper-line:#DCE2E8;--paper-accent:#2B59C3;--paper-warm:#FFF6E0}
.a4{width:794px;height:1123px;box-sizing:border-box;background:var(--paper);color:var(--paper-ink);padding:56px 60px;position:relative;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.12);margin:0 auto;display:flex;flex-direction:column;gap:22px;font-family:var(--f-body);font-size:19px;line-height:1.5}
.pf{border:14px solid var(--paper-warm);outline:3px solid var(--paper-accent);outline-offset:-26px}
.pf-title,.ws-title{flex:none}
.pf-title{font-family:var(--f-display);font-size:46px;line-height:1.1;margin:8px 0 0;color:var(--paper-accent);text-align:center;text-wrap:balance}
.pf-photo{background:var(--paper-line);border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--paper-muted);aspect-ratio:4/3}
.pf-photo img{width:100%;height:100%;object-fit:cover;display:block}
.pf-photo.wide{aspect-ratio:16/10}
.pf-photo.round{border-radius:50%;aspect-ratio:1;width:280px;flex:none;border:8px solid var(--paper-warm)}
.pf-grid.lern{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:380px}
.pf-grid.lern .big{grid-row:1/3;aspect-ratio:auto}.pf-grid.lern .pf-photo:not(.big){aspect-ratio:auto}
.pf-grid.four{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pf-grid.four figure{margin:0;display:flex;flex-direction:column;gap:6px}
.pf-grid.four figcaption{text-align:center;font-size:18px;min-height:27px}
.pf-letter{white-space:pre-wrap;font-size:20px;line-height:1.6;flex:1;overflow:hidden}
.pf-stars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:24px;flex:1}
.pf-stars li{display:flex;gap:14px;align-items:baseline}
.pf-stars li::before{content:"★";color:#E9A23B;font-size:30px;line-height:1}
.pf-ich{display:flex;flex-direction:column;align-items:center;gap:26px;flex:1}
.pf-ich dl{margin:0;width:100%;display:flex;flex-direction:column;gap:16px;font-size:23px}
.pf-ich dl div{display:flex;gap:10px;border-bottom:2px dotted var(--paper-line);padding-bottom:6px}
.pf-ich dt{color:var(--paper-muted);flex:none}.pf-ich dd{margin:0;font-weight:700}
.pf-foot{display:flex;justify-content:space-between;color:var(--paper-muted);font-size:16px;border-top:2px solid var(--paper-line);padding-top:10px;margin-top:auto}
.ws{gap:26px}
.ws-title{font-family:var(--f-display);font-size:40px;margin:0;line-height:1.1}
.ws-name{display:flex;justify-content:space-between;font-size:18px;color:var(--paper-muted)}
.ws-text{margin:0;font-size:20px}
.ws-svg{display:block;max-width:none}
.ws-mal{display:flex;flex-direction:column;gap:10px}
.ws-box{border:3px solid var(--paper-ink);border-radius:16px}
.deco{position:absolute;z-index:2;pointer-events:none}
.deco svg{display:block;width:100%;height:100%}
.pf.themed .pf-title{padding-inline:110px}
.pf.themed .pf-foot{padding-inline:100px}
.ws.themed .ws-title{padding-right:110px}
.pf-row{display:flex;justify-content:space-between;flex:none;margin-top:-6px}
.pf-row span{display:block;width:46px;height:46px}
.ws-svg .m *{vector-effect:non-scaling-stroke}
.chip-ico{display:inline-block;width:22px;height:22px;vertical-align:-6px;margin-right:4px}
.chip-ico svg{width:100%;height:100%}
#print-root{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;padding:0!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  #print-root .a4{box-shadow:none;margin:0;zoom:1!important;width:210mm;height:297mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before{display:none}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;z-index:30}
@media (prefers-reduced-motion:no-preference){.kid-row,.chip,.seg button{transition:background .15s,border-color .15s}}
</style>

<body>

<div id="lock">
  <div class="wrap">
    <h1>Kita<span>-</span>Helfer</h1>
    <p class="muted" id="lock-msg">Verbinde …</p>
    <form id="lock-form" hidden>
      <div class="card">
        <label class="f" id="email-wrap" hidden>E-Mail<input type="email" id="email" autocomplete="username" inputmode="email"></label>
        <label class="f">Passwort<input type="password" id="pw1" autocomplete="current-password" minlength="8" required></label>
        <label class="f" id="pw2-wrap" hidden>Passwort wiederholen<input type="password" id="pw2" autocomplete="new-password" minlength="8"></label>
        <label class="row small"><input type="checkbox" id="remember" style="width:auto"> Auf diesem Gerät angemeldet bleiben</label>
        <div class="err" id="lock-err"></div>
        <button class="btn" id="lock-btn" type="submit">Entsperren</button>
      </div>
    </form>
    <div class="note" id="lock-note" hidden></div>
  </div>
</div>

<header><div class="wrap"><h1>Kita<span>-</span>Helfer</h1><span class="pill" id="sync">…</span><button class="btn-sm" id="lock-now" type="button">Sperren</button></div></header>
<main class="wrap" id="main"></main>
<nav class="tabs" aria-label="Bereiche"><div class="wrap" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>
<div id="print-root" aria-hidden="true"></div>

<script src="jszip.min.js"></script>
<script src="platform.js"></script>
<script src="config.js"></script>
<script src="remote.js"></script>
<script>
const AREAS=[["bew","Körper & Bewegung"],["spr","Sprache"],["soz","Sozial-emotional"],["mat","Mathe & Forschen"],["kun","Kunst & Musik"],["nat","Natur & Umwelt"],["sel","Selbstständigkeit"]];
const AREA_NAME=Object.fromEntries(AREAS);
const STATUS=[["da","Da"],["fehlt","Fehlt"],["krank","Krank"],["urlaub","Urlaub"]];
const TABS=[
  ["heute","Heute",'<path d="M4 6h16M4 12h16M4 18h10"/><path d="M17 16l2 2 3-4"/>'],
  ["beob","Beobachten",'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'],
  ["gespraech","Gespräch",'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'],
  ["woche","Woche",'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  ["gestalten","Gestalten",'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>'],
  ["kinder","Kinder",'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 2 6 5.5"/>']
];
const TEMPLATES={
  ausflug:["Ausflug","Liebe Eltern,\n\nam {{Datum}} machen wir mit der Gruppe {{Gruppe}} einen Ausflug {{Ziel}}. Wir starten um {{Uhrzeit}} in der Kita und sind gegen {{Rückkehr}} zurück.\n\nBitte geben Sie Ihrem Kind wettergerechte Kleidung, feste Schuhe und {{Mitbringen}} mit.\n\nViele Grüße\n{{Name}}"],
  laeuse:["Kopfläuse","Liebe Eltern,\n\nin der Gruppe {{Gruppe}} sind Kopfläuse aufgetreten. Bitte schauen Sie in den nächsten Tagen den Kopf Ihres Kindes gründlich durch, am besten mit einem Läusekamm.\n\nWenn Sie Läuse oder Nissen finden, geben Sie uns bitte Bescheid und behandeln Sie Ihr Kind vor dem nächsten Kita-Besuch. Die Behandlung sollte nach 8 bis 10 Tagen wiederholt werden.\n\nVielen Dank für Ihre Mithilfe!\n{{Name}}"],
  krankheit:["Krankheit in der Gruppe","Liebe Eltern,\n\nin der Gruppe {{Gruppe}} ist {{Krankheit}} aufgetreten. Bitte achten Sie in den nächsten Tagen auf Anzeichen wie {{Anzeichen}}.\n\nWenn Ihr Kind Symptome zeigt, lassen Sie es bitte zu Hause und informieren Sie uns.\n\nViele Grüße\n{{Name}}"],
  gespraech:["Einladung Entwicklungsgespräch","Liebe Familie {{Familienname}},\n\ngern möchte ich mit Ihnen über die Entwicklung von {{Kind}} sprechen. Ich schlage als Termin {{Termin}} vor. Das Gespräch dauert etwa {{Dauer}}.\n\nBitte geben Sie mir kurz Bescheid, ob der Termin passt.\n\nViele Grüße\n{{Name}}"],
  wechsel:["Wechselkleidung","Liebe Eltern,\n\nbitte füllen Sie die Wechselkleidung Ihres Kindes wieder auf. Es fehlt: {{Was fehlt}}.\n\nVielen Dank!\n{{Name}}"]
};
const WEEKDAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];

/* ---------- crypto: AES-GCM with a key derived from her password ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=u=>{let s="";new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter){const base=await crypto.subtle.importKey("raw",TE.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"])}
async function encryptObj(o,key=KEY){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,TE.encode(JSON.stringify(o)));return {iv:b64(iv),ct:b64(ct)}}
async function decryptObj(b,key=KEY){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(b.iv)},key,unb64(b.ct));return JSON.parse(TD.decode(pt))}

/* ---------- store: each section is one encrypted document ---------- */
let KEY=null,COL=null,META=null,unsub=null,DL=null,ASSETS=null;
const DOCS={},dirty=new Set(),ver={},timers={},chains={},seenTs={};
/* MERGE[name](local,remote) joins two versions of a document item by item, so that edits made on
   two devices do not overwrite each other; documents without a merge rule use last write wins */
const MERGE={};
const canon=x=>JSON.stringify(x,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(k=>[k,v[k]])):v);
function D(name,init){if(!DOCS[name])DOCS[name]=init();return DOCS[name]}
function cacheIdx(){try{return JSON.parse(LS.get("kh:idx")||"[]")}catch{return []}}
function cachePut(name,body){LS.set("kh:c:"+name,JSON.stringify(body));const i=cacheIdx();if(!i.includes(name)){i.push(name);LS.set("kh:idx",JSON.stringify(i))}}
function touch(name){dirty.add(name);ver[name]=(ver[name]||0)+1;clearTimeout(timers[name]);timers[name]=setTimeout(()=>flush(name),700);setSync("saving")}
async function flush(name){
  const v=ver[name];const body=await encryptObj(DOCS[name]);body.ts=Date.now();seenTs[name]=body.ts;cachePut(name,body);
  if(!COL){if(ver[name]===v)dirty.delete(name);setSync();return}
  chains[name]=(chains[name]||Promise.resolve()).then(()=>COL.doc(name).set(body)).then(()=>{if(ver[name]===v)dirty.delete(name);setSync()},e=>{console.warn(e);setSync(e&&e.code==="quota_exceeded"?"full":"offline")});
}
let syncState="";
function setSync(s){
  if(s===undefined)s=dirty.size?"saving":(window.platform.hasRemote()?window.platform.status():"local");
  if(s==="ok"&&!window.platform.hasRemote())s="local";
  syncState=s;const el=$("#sync");
  const m={ok:["ok","Synchronisiert"],saving:["","Speichert …"],offline:["warn","Offline, lokal gespeichert"],local:["","Nur auf diesem Gerät"],full:["bad","Speicher voll"]}[s]||["",""];
  el.className="pill "+m[0];el.textContent=m[1];
}
window.addEventListener("online",()=>{dirty.forEach(n=>flush(n))});

/* ---------- unlock ---------- */
async function boot(){
  let db=null,user=null;
  if(window.platform&&window.platform.use){[db,user]=await Promise.all([window.platform.use("db").catch(()=>null),window.platform.use("user").catch(()=>null)]);try{DL=await window.platform.use("downloads")}catch{DL=null}try{ASSETS=await window.platform.use("assets")}catch{ASSETS=null}}
  const id=user?await user.id():null;
  let cloudMeta=null,cloudErr=false;
  if(!(db&&id))ASSETS=null;
  if(window.KH_SYNC&&!window.KH_SYNC.loggedIn()&&db&&id){COL=db.collection("data/users/"+id);return showLogin()}
  if(db&&id){COL=db.collection("data/users/"+id);try{const m=await COL.doc("meta").get();if(m.exists)cloudMeta=m.data()}catch(e){cloudErr=true}}
  let localMeta=null;try{localMeta=JSON.parse(LS.get("kh:meta")||"null")}catch{}
  META=cloudMeta||localMeta;
  if(COL&&!cloudMeta&&localMeta&&!cloudErr){try{await COL.doc("meta").set(localMeta)}catch{}}
  const msg=$("#lock-msg"),note=$("#lock-note");
  if(!META&&cloudErr){msg.textContent="Keine Verbindung zum Speicher. Bitte später noch einmal öffnen.";return}
  const remembered=LS.get("kh:key");
  if(META&&remembered){try{const k=await crypto.subtle.importKey("raw",unb64(remembered),"AES-GCM",true,["encrypt","decrypt"]);await decryptObj(META.check,k);KEY=k;return start()}catch{LS.del("kh:key")}}
  $("#lock-form").hidden=false;note.hidden=false;
  if(META){msg.textContent="Bitte gib dein Passwort ein, um deine Gruppe zu öffnen.";$("#lock-btn").textContent="Entsperren";
    note.textContent="Deine Daten sind mit diesem Passwort verschlüsselt. Ohne das richtige Passwort kann niemand sie lesen.";}
  else{msg.textContent="Willkommen! Lege ein Passwort fest. Damit werden alle Einträge verschlüsselt, bevor sie dein Gerät verlassen.";
    $("#pw2-wrap").hidden=false;$("#pw1").autocomplete="new-password";$("#lock-btn").textContent="Passwort festlegen";
    note.innerHTML="<b>Wichtig:</b> Schreib dir das Passwort an einem sicheren Ort auf. Es lässt sich nicht zurücksetzen, und ohne es sind die Daten verloren."+(window.platform.hasRemote()?" Am Laptop öffnest du dieselbe Adresse und gibst dasselbe Passwort ein.":" Die Daten bleiben auf diesem Gerät.");}
  setTimeout(()=>$("#pw1").focus(),50);
}
let LOGIN=false;
function showLogin(){
  LOGIN=true;$("#lock-form").hidden=false;$("#email-wrap").hidden=false;$("#email").value=window.KH_SYNC.email();
  $("#lock-msg").textContent="Melde dich mit deiner E-Mail und deinem Passwort an. Beim allerersten Mal wird dabei dein Konto eingerichtet.";
  $("#lock-btn").textContent="Anmelden";const note=$("#lock-note");note.hidden=false;
  note.innerHTML="Alles wird mit deinem Passwort verschlüsselt, bevor es dein Gerät verlässt. <b>Schreib dir das Passwort an einem sicheren Ort auf.</b> Es lässt sich nicht zurücksetzen, und ohne es sind die Daten verloren.";
  setTimeout(()=>($("#email").value?$("#pw1"):$("#email")).focus(),50);
}
async function doLogin(pw,err){
  const SY=window.KH_SYNC,email=$("#email").value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent="Bitte gib deine E-Mail-Adresse ein.";return false}
  const setup=!$("#pw2-wrap").hidden;let r;
  if(!setup){r=await SY.login(email,pw);
    if(r==="invalid"){$("#pw2-wrap").hidden=false;$("#lock-btn").textContent="Konto einrichten";
      err.textContent="Mit dieser E-Mail und diesem Passwort gibt es noch kein Konto. Richtest du die App zum ersten Mal ein? Dann wiederhole das Passwort. Sonst prüfe deine Eingabe.";return false}}
  else{if(pw!==$("#pw2").value){err.textContent="Die beiden Passwörter sind nicht gleich.";return false}
    r=await SY.signup(email,pw);
    if(r==="exists"){$("#pw2-wrap").hidden=true;$("#pw2").value="";$("#lock-btn").textContent="Anmelden";err.textContent="Für diese E-Mail gibt es schon ein Konto, aber das Passwort stimmt nicht.";return false}}
  if(r!=="ok"){err.textContent={offline:"Keine Internetverbindung. Für die erste Anmeldung braucht die App Internet.",confirm:"Supabase verlangt noch eine E-Mail-Bestätigung. Bitte in Supabase „Confirm email“ ausschalten (siehe Anleitung).",closed:"Neue Konten sind gesperrt. Bitte prüfe E-Mail und Passwort."}[r]||"Die Anmeldung hat nicht geklappt. Bitte später noch einmal versuchen.";return false}
  LOGIN=false;
  try{const m=await COL.doc("meta").get();META=m.exists?m.data():null}catch{err.textContent="Keine Verbindung zum Speicher. Bitte später noch einmal versuchen.";return false}
  return true;
}
$("#lock-form").addEventListener("submit",async e=>{
  e.preventDefault();const err=$("#lock-err");err.textContent="";const pw=$("#pw1").value;
  if(pw.length<8){err.textContent="Das Passwort braucht mindestens 8 Zeichen.";return}
  $("#lock-btn").disabled=true;
  try{
    if(LOGIN&&!(await doLogin(pw,err)))return;
    if(META){const k=await deriveKey(pw,unb64(META.salt),META.iter);try{await decryptObj(META.check,k)}catch{err.textContent="Das Passwort stimmt nicht.";return}KEY=k;LS.set("kh:meta",JSON.stringify(META))}
    else{if(!$("#pw2-wrap").hidden&&pw!==$("#pw2").value){err.textContent="Die beiden Passwörter sind nicht gleich.";return}
      const salt=crypto.getRandomValues(new Uint8Array(16)),iter=310000;KEY=await deriveKey(pw,salt,iter);
      META={salt:b64(salt),iter,check:await encryptObj({v:"kita-helfer"},KEY)};LS.set("kh:meta",JSON.stringify(META));
      if(COL){try{await COL.doc("meta").set(META)}catch(e){err.textContent="Konnte nicht speichern. Bitte Verbindung prüfen.";KEY=null;META=null;return}}}
    if($("#remember").checked)LS.set("kh:key",b64(await crypto.subtle.exportKey("raw",KEY)));
    $("#pw1").value="";$("#pw2").value="";start();
  }finally{$("#lock-btn").disabled=false}
});
$("#lock-now").addEventListener("click",()=>{LS.del("kh:key");location.reload()});

async function start(){
  $("#lock").hidden=true;
  for(const n of cacheIdx()){try{const b=JSON.parse(LS.get("kh:c:"+n));DOCS[n]=await decryptObj(b);seenTs[n]=b.ts}catch{}}
  setSync();render();
  window.platform.onStatus(()=>{if(!dirty.size)setSync()});window.platform.startSync();
  if(COL){unsub=COL.onSnapshot(async snap=>{
    let changed=false;
    const ids=new Set(snap.docs.map(d=>d.id));
    for(const n in DOCS)if(!ids.has(n)&&!dirty.has(n)&&seenTs[n]){delete DOCS[n];changed=true}
    for(const d of snap.docs){const M=MERGE[d.id];if(d.id==="meta"||(dirty.has(d.id)&&!M))continue;const b=d.data();if(!b||!b.ct||seenTs[d.id]===b.ts)continue;
      try{const remote=await decryptObj(b);seenTs[d.id]=b.ts;
        if(M&&DOCS[d.id]){const merged=M(DOCS[d.id],remote);DOCS[d.id]=merged;if(canon(merged)!==canon(remote))touch(d.id);else cachePut(d.id,b)}
        else{DOCS[d.id]=remote;cachePut(d.id,b)}changed=true}catch(e){console.warn(e)}}
    if(!dirty.size)setSync();
    if(changed)safeRender();
  },e=>{console.warn(e);setSync("offline")})}
}

/* ---------- photos: resized in the browser, encrypted, stored as opaque files ---------- */
const urlCache={};let hydrating=0;const hydrateQ=[];
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i)};i.onerror=()=>rej(new Error("Bild nicht lesbar"));i.src=u})}
async function shrink(file,max,q){
  let src;try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}catch{src=await loadImage(file)}
  const w=src.width,h=src.height,s=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
async function uploadEncrypted(blob){
  const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},KEY,await blob.arrayBuffer());
  const r=await ASSETS.upload(new Blob([JSON.stringify({v:1,iv:b64(iv),ct:b64(ct)})],{type:"application/json"}),{type:"application/json"});return r.id;
}
async function photoBlob(asset){
  const j=JSON.parse(await window.platform.blobText(asset));
  return new Blob([await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(j.iv)},KEY,unb64(j.ct))],{type:"image/jpeg"});
}
async function photoURL(asset){if(!urlCache[asset])urlCache[asset]=photoBlob(asset).then(b=>URL.createObjectURL(b));return urlCache[asset]}
function hydrate(){document.querySelectorAll("img[data-asset]:not([src])").forEach(img=>hydrateQ.push(img));pump()}
function pump(){while(hydrating<4&&hydrateQ.length){const img=hydrateQ.shift();hydrating++;photoURL(img.dataset.asset).then(u=>{img.src=u},()=>{delete urlCache[img.dataset.asset];img.alt="Foto nicht verfügbar"}).finally(()=>{hydrating--;pump()})}}
async function addPhotos(kid,files){
  const st=$("#up-state");let ok=0;
  for(let i=0;i<files.length;i++){
    if(st)st.textContent=`Lade Foto ${i+1} von ${files.length} hoch …`;
    try{const f=files[i];const [full,thumb]=await Promise.all([shrink(f,1800,.85),shrink(f,360,.72)]);
      const asset=await uploadEncrypted(full),th=await uploadEncrypted(thumb);
      const d=f.lastModified?isoLocal(new Date(f.lastModified)):today();
      fotoDoc(kid).items.push({id:uid(),asset,thumb:th,date:d,caption:"",t:Date.now()});touch("fotos-"+kid);ok++;
    }catch(e){console.warn(e);toast(e&&e.code==="quota_or_state"?"Der Fotospeicher ist voll.":"Ein Foto konnte nicht hochgeladen werden.");if(e&&e.code==="quota_or_state")break}
  }
  if(ok)toast(ok===1?"Foto gespeichert":ok+" Fotos gespeichert");ui.usage=null;render();
}
async function deletePhoto(kid,pid){const d=fotoDoc(kid);const p=d.items.find(x=>x.id===pid);if(!p)return;d.items=d.items.filter(x=>x.id!==pid);touch("fotos-"+kid);
  for(const a of [p.asset,p.thumb]){try{await ASSETS.delete(a)}catch(e){console.warn(e)}}}
async function farewellZip(kid){
  const k=kidById(kid);const list=fotos(kid).slice().reverse();const st=$("#up-state");
  if(!window.JSZip){toast("Das Packen der Mappe ist gerade nicht verfügbar");return}
  const zip=new JSZip();const safe=k.name.replace(/[^\wäöüÄÖÜß -]/g,"").trim()||"Kind";
  for(let i=0;i<list.length;i++){if(st)st.textContent=`Packe Foto ${i+1} von ${list.length} …`;
    try{zip.file(`Fotos/${list[i].date}_${String(i+1).padStart(3,"0")}.jpg`,await photoBlob(list[i].asset))}catch{}}
  zip.file("Fotos/Bildunterschriften.txt",list.map((p,i)=>`${p.date}_${String(i+1).padStart(3,"0")}.jpg  ${p.caption||""}`).join("\n"));
  const obs=allObs().filter(o=>o.kid===kid).reverse();
  zip.file("Beobachtungen.txt",`Beobachtungen ${k.name}\n\n`+AREAS.map(([a,n])=>{const l=obs.filter(o=>(o.areas||[]).includes(a));return l.length?`${n}\n${l.map(o=>`- ${fmtD(o.date,{day:"2-digit",month:"2-digit",year:"numeric"})}: ${o.text}`).join("\n")}\n`:""}).filter(Boolean).join("\n"));
  const blob=await zip.generateAsync({type:"blob"});if(st)st.textContent="";
  try{await DL.save({filename:`Abschied-${safe}.zip`,data:blob});toast("Abschiedsmappe gespeichert")}catch(e){if(!e||e.code!=="declined")toast("Speichern hat nicht geklappt")}
}

async function makeBackup(){
  const st=()=>$("#bk-state");
  if(!window.JSZip){toast("Die Sicherung ist gerade nicht verfügbar");return}
  for(const n of [...dirty])await flush(n);
  const zip=new JSZip(),out={app:"kita-helfer",v:2,created:today(),meta:META,docs:{}};
  for(const n in DOCS)out.docs[n]=await encryptObj(DOCS[n]);
  const ids=[];for(const n in DOCS)if(n.startsWith("fotos-"))for(const p of DOCS[n].items||[])ids.push(p.asset,p.thumb);
  let missing=0;
  for(let i=0;i<ids.length;i++){if(st())st().textContent=`Packe Foto-Datei ${i+1} von ${ids.length} …`;
    try{zip.file("fotos/"+ids[i]+".json",await window.platform.blobText(ids[i]))}catch{missing++}}
  zip.file("sicherung.json",JSON.stringify(out));
  zip.file("LIESMICH.txt","Kita-Helfer-Sicherung vom "+today()+".\nAlle Inhalte sind verschlüsselt. Einlesen in der App unter Kinder → Sicherung einlesen, mit demselben Passwort.\n");
  if(st())st().textContent="Erstelle ZIP-Datei …";
  const blob=await zip.generateAsync({type:"blob"});if(st())st().textContent="";
  try{await DL.save({filename:`kita-helfer-sicherung-${today()}.zip`,data:blob});LS.set("kh:lastBackup",today());
    toast(missing?`Sicherung gespeichert, ${missing} Foto-Dateien fehlten`:"Sicherung gespeichert");render()}
  catch(e){if(!e||e.code!=="declined")toast("Speichern hat nicht geklappt")}
}
async function readBackup(f){
  let j,zip=null;
  if(/\.zip$/i.test(f.name)||f.type==="application/zip"){zip=await JSZip.loadAsync(f);const e=zip.file("sicherung.json");if(!e)throw new Error("format");j=JSON.parse(await e.async("string"))}
  else j=JSON.parse(await f.text());
  if(j.app!=="kita-helfer"||!j.meta)throw new Error("format");
  if(j.meta.salt!==META.salt)throw new Error("pw");
  const blobCount=zip?zip.file(/^fotos\/.+\.json$/).length:0;
  return {created:j.created||today(),docs:j.docs,zip,blobCount};
}
async function restoreBackup(b){
  const st=$("#bk-state");
  try{
    if(b.zip){const files=b.zip.file(/^fotos\/.+\.json$/);
      for(let i=0;i<files.length;i++){if(st)st.textContent=`Lese Foto-Datei ${i+1} von ${files.length} ein …`;
        await window.platform.restoreBlob(files[i].name.slice(6,-5),await files[i].async("string"))}}
    for(const n in b.docs){DOCS[n]=await decryptObj(b.docs[n]);touch(n)}
    toast("Sicherung eingelesen");
  }catch(e){console.warn(e);toast("Einlesen hat nicht geklappt")}
}

    AREAS.forEach(([a,n])=>{const l=obs.filter(o=>(o.areas||[]).includes(a));t+=`${n}\n${l.length?l.map(o=>`- ${fmtD(o.date,{day:"2-digit",month:"2-digit",year:"2-digit"})}: ${o.text}`).join("\n"):"- noch keine Beobachtung"}\n\n`});
    t+=`Stärken und Freude\n${gs.staerken||"–"}\n\nNächste Entwicklungsschritte\n${gs.ziele||"–"}\n\nAbsprachen mit den Eltern\n${gs.absprachen||"–"}`;copy(t)},
  export:t=>{t.disabled=true;makeBackup().finally(()=>{t.disabled=false})},
  doImport:t=>{t.disabled=true;restoreBackup(ui.pendingImport).finally(()=>{ui.pendingImport=null;render()})},
  cancelImport:()=>{ui.pendingImport=null;render()}
};
const BIND={
  obsText:t=>ui.obsText=t.value,
  obsDate:t=>ui.obsDate=t.value||today(),
  gs:t=>{const k=kidById(ui.gsKid);if(!k)return;k.gs=k.gs||{};k.gs[t.dataset.f]=t.value;touch("kinder")},
  wkThema:t=>{const w=planDoc().weeks[ui.week]||(planDoc().weeks[ui.week]={thema:"",days:["","","","",""]});w.thema=t.value;touch("plan")},
  wkDay:t=>{const w=planDoc().weeks[ui.week]||(planDoc().weeks[ui.week]={thema:"",days:["","","","",""]});w.days[+t.dataset.i]=t.value;touch("plan")},
  ph:t=>{briefeDoc().vals[t.dataset.k]=t.value;touch("briefe");const B=briefeDoc();$("#preview").textContent=fillTpl(B.tpl[ui.tpl]??TEMPLATES[ui.tpl][1],B.vals)},
  caption:t=>{const p=fotoDoc(ui.album).items.find(x=>x.id===ui.photo);if(p){p.caption=t.value;touch("fotos-"+ui.album)}},
  tplText:t=>{briefeDoc().tpl[ui.tpl]=t.value;touch("briefe");$("#preview").textContent=fillTpl(t.value,briefeDoc().vals)}
};
const CHG={
  day:t=>{ui.day=t.value||today();render()},
  filterKid:t=>{ui.filterKid=t.value;render()},
  gsKid:t=>{ui.gsKid=t.value;render()},
  gsRange:t=>{ui.gsRange=t.value;render()},
  tpl:t=>{ui.tpl=t.value;render()},
  tplText:()=>render(),
  upload:t=>{const files=[...t.files];if(files.length&&ui.album)addPhotos(ui.album,files)},
  import:async t=>{const f=t.files[0];t.value="";if(!f)return;
    try{const b=await readBackup(f);ui.pendingImport=b;render()}catch(e){toast(e&&e.message==="pw"?"Diese Sicherung gehört zu einem anderen Passwort":"Diese Datei ist keine Kita-Helfer-Sicherung")}}
};
const main=$("#main");
main.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(t&&ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t)}});
main.addEventListener("input",e=>{const t=e.target;if(t.dataset.bind&&BIND[t.dataset.bind])BIND[t.dataset.bind](t)});
main.addEventListener("change",e=>{const t=e.target;if(t.dataset.chg&&CHG[t.dataset.chg])CHG[t.dataset.chg](t);else if(t.dataset.bind==="tplText")render()});
main.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id==="obs-form"){const err=$("#obs-err");
    if(!ui.obsKid){err.textContent="Bitte wähle oben ein Kind aus.";return}
    if(!ui.obsText.trim()){err.textContent="Bitte schreib kurz auf, was du beobachtet hast.";return}
    const n=obsDocName(ui.obsDate);D(n,()=>({items:[]})).items.push({id:uid(),kid:ui.obsKid,date:ui.obsDate,areas:ui.obsAreas.slice(),text:ui.obsText.trim(),t:Date.now()});touch(n);
    ui.obsText="";ui.obsAreas=[];ui.obsDate=today();toast("Beobachtung gespeichert");render()}
  if(e.target.id==="kid-form"){const id=e.target.dataset.id;const v={name:$("#k-name").value.trim(),geb:$("#k-geb").value,abholer:$("#k-ab").value.trim(),info:$("#k-info").value.trim()};if(!v.name)return;
    if(id)Object.assign(kidById(id),v);else kinderDoc().list.push(Object.assign({id:uid()},v));touch("kinder");ui.editKid=null;render()}
});
boot();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!window.__khReloaded&&!KEY){window.__khReloaded=true;location.reload()}});
</script>
<script src="motive.js"></script>
<script src="stil.js"></script>
<script src="gestalten.js"></script>
</body>
